<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FF5C8A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Candyland" />
  <meta name="description" content="Draw Candyland cards on your phone. Cards leave the deck until you Reset." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
  <title>Candyland Card Drawer</title>
</head>
<body>
  <div class="bg-swirl" aria-hidden="true"></div>

  <main class="app">
    <header class="brand">
      <h1 class="rainbow-title" aria-label="Candyland">
        <span>C</span><span>a</span><span>n</span><span>d</span><span>y</span><span>l</span><span>a</span><span>n</span><span>d</span>
      </h1>
    </header>

    <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>

    <section class="stage" aria-live="polite">
      <div class="card-stage">
        <div class="deck-stack" id="deck-stack" aria-hidden="true">
          <div class="ghost"></div>
          <div class="ghost"></div>
          <div class="ghost"></div>
        </div>
        <div class="placeholder" id="placeholder">Tap DRAW!<br />to start</div>
        <article class="play-card" id="play-card" hidden></article>
      </div>
    </section>

    <div class="actions">
      <button type="button" class="btn btn-draw" id="draw-btn">DRAW!</button>
    </div>

    <details class="grownups" id="grownups">
      <summary>Grown-ups</summary>
      <div class="grownups-panel">
        <label>
          Deck size
          <select id="deck-select" aria-label="Choose Candyland deck size">
            <option value="classic64">Classic (64 cards)</option>
            <option value="vintage64">Vintage (64) — Candy Hearts</option>
            <option value="modern44">Modern (44 cards)</option>
          </select>
        </label>
        <button type="button" class="btn-reset-tiny" id="reset-btn">Reset deck</button>
        <p class="install-tip">
          iPhone: Share → Add to Home Screen<br />
          Android: Menu → Add to Home screen
        </p>
      </div>
    </details>

    <p class="app-rev" id="app-rev" aria-hidden="true"></p>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <div class="modal-backdrop" id="reset-modal" role="dialog" aria-modal="true" aria-labelledby="reset-title">
    <div class="modal">
      <h3 id="reset-title">Reset the deck?</h3>
      <p>Put all the cards back and shuffle again.</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="reset-cancel">Cancel</button>
        <button type="button" class="btn btn-draw btn-modal-ok" id="reset-confirm">Reset</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
